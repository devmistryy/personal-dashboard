<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day plan — color systems</title>
<link rel="stylesheet" href="../css/main.css">
<style>
  body { padding: 28px 24px 60px; }
  .mk-wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
  .mk-h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .mk-sub { font-size: 13px; color: var(--text-tertiary); margin: 6px 0 18px; max-width: 780px; line-height: 1.5; }
  .mk-variant { margin-bottom: 16px; }
  .mk-title { font-size: 15px; font-weight: 700; }
  .mk-desc { font-size: 12.5px; color: var(--text-secondary); margin: 5px 0 14px; line-height: 1.5; }
  .mk-desc em { font-style: normal; color: var(--text-tertiary); }
  .mk-swatches { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; }
  .mk-swatch { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); }
  .mk-swatch i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
</style>
</head>
<body>
<div class="mk-wrap">
  <h1 class="mk-h1">Day plan — color systems</h1>
  <p class="mk-sub">Same bar, five ways to assign color. Wake is 7:30 so morning routine has room. The app is unchanged until you pick one.</p>
  <div id="variants"></div>
</div>
<script>
const SLEEP = 23.5, WAKE = 7.5, NOW = 19.75;
const ICON = {
  sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>',
};
const ITEMS = [
  { id: 'am',     label: 'Morning routine', short: 'Routine', mark: 'sun', from: WAKE, to: 8.5 },
  { id: 'bfast',  label: 'Breakfast',       short: 'Breakfast', from: 8.5, to: 10 },
  { id: 'work',   label: 'Workout',         short: 'Workout', from: 10, to: 13, hatch: true },
  { id: 'lunch',  label: 'Lunch',           short: 'Lunch', from: 12.5, to: 14.5 },
  { id: 'shake',  label: 'Protein shake',   short: 'Shake', from: 14.5, to: 18 },
  { id: 'dinner', label: 'Dinner',          short: 'Dinner', from: 18, to: 20.5 },
  { id: 'pm',     label: 'Night routine',   short: 'Routine', mark: 'moon', from: SLEEP - 1, to: SLEEP },
];
const CUTS = [
  { label: 'No caffeine', icon: '☕', from: SLEEP - 10, color: '#B08968' },
  { label: 'No food',     icon: '🍽️', from: SLEEP - 3,  color: '#FF6B6B' },
  { label: 'No liquids',  icon: '💧', from: SLEEP - 2,  color: '#4A9EFF' },
  { label: 'Screens off', icon: '📱', from: SLEEP - 1,  color: '#9B7BD6' },
];

const PALETTES = [
  {
    name: 'A · What’s in the app now',
    desc: 'Morning routine and breakfast are both warm gold, so they read as one block. Night is a separate cool gray. <em>The problem you just spotted.</em>',
    colors: { am: '#E4B86A', bfast: '#F2C063', work: '#6BE3A4', lunch: '#F7B27A', shake: '#C9A7FF', dinner: '#F2804C', pm: '#8FA0C4' },
  },
  {
    name: 'B · By job: routines / meals / training',
    desc: 'Routines share a blue family (light AM, dark PM). Meals stay warm and stepped. Workout stays green. Shake is the odd meal, so it keeps a separate violet. <em>You learn three hues, then shades.</em>',
    colors: { am: '#6EC4E8', bfast: '#F2C063', work: '#6BE3A4', lunch: '#F7B27A', shake: '#C9A7FF', dinner: '#F2804C', pm: '#6B7FBF' },
  },
  {
    name: 'C · Clock: hue walks the day',
    desc: 'Sunrise cream → breakfast amber → workout green → lunch coral → shake violet → dinner rust → night indigo. Neighboring blocks are never the same family. <em>Reads left-to-right as morning to night.</em>',
    colors: { am: '#F6E2A8', bfast: '#E39A3C', work: '#5BC98A', lunch: '#F28B4C', shake: '#C07AE8', dinner: '#E25D4A', pm: '#5B6FA8' },
  },
  {
    name: 'D · Meals one orange, everything else named',
    desc: 'Breakfast, lunch, dinner, and shake are one orange at four brightnesses. Morning is sky, night is indigo, workout is green. <em>Meals group at a glance; routines can’t be mistaken for food.</em>',
    colors: { am: '#7EC8E3', bfast: '#F6D48A', work: '#6BE3A4', lunch: '#F0A35A', shake: '#E07A3A', dinner: '#C44F2E', pm: '#5C6BA0' },
  },
  {
    name: 'E · Quiet bar, color only where it matters',
    desc: 'Most blocks are the same warm gray. Workout, shake, and the two routines get the only real color. <em>Least noisy. You notice training and the bookends, not every meal.</em>',
    colors: { am: '#E4B86A', bfast: '#A8A49C', work: '#6BE3A4', lunch: '#A8A49C', shake: '#C9A7FF', dinner: '#A8A49C', pm: '#8FA0C4' },
  },
];

const clock = h => {
  const m = Math.round(h * 60) % 1440, hh = Math.floor(m / 60);
  const ap = hh >= 12 ? 'PM' : 'AM';
  return `${hh % 12 || 12}:${String(m % 60).padStart(2, '0')} ${ap}`;
};
const tick = h => clock(h).replace(' AM', 'a').replace(' PM', 'p').replace(':00', '');
const pct = t => ((t - WAKE) / (SLEEP - WAKE) * 100).toFixed(2) + '%';

function render(el, colors) {
  const flags = CUTS.map(c =>
    `<span class="dp-flag" style="--c:${c.color};left:${pct(c.from)}" title="${c.label}">${c.icon}<i>${tick(c.from)}</i></span>` +
    `<span class="dp-cut" style="--c:${c.color};left:${pct(c.from)}"></span>`).join('');
  const blocks = ITEMS.map(p => {
    const solid = p.hatch ? `;--solid:${((12.5 - p.from) / (p.to - p.from) * 100).toFixed(2)}%` : '';
    const inner = p.mark ? `${ICON[p.mark]}<b>${p.short}</b>` : p.short;
    return `<div class="dp-blk${p.hatch ? ' hatch' : ''}${p.mark ? ' mark' : ''}" style="--c:${colors[p.id]};left:${pct(p.from)};width:${((p.to - p.from) / (SLEEP - WAKE) * 100).toFixed(2)}%${solid}" title="${p.label}">${inner}</div>`;
  }).join('');
  let ticks = `<span class="l">${tick(WAKE)}</span><span class="r" style="left:100%">${tick(SLEEP)}</span>`;
  for (let t = 8; t < SLEEP; t += 2)
    if (SLEEP - t > 0.9) ticks += `<span${SLEEP - t < 2 ? ' class="near-end"' : ''} style="left:${pct(t)}">${tick(t)}</span>`;
  el.innerHTML = `<div class="day-plan">${flags}<div class="dp-track">${blocks}<div class="dp-elapsed" style="width:${pct(NOW)}"></div></div><div class="dp-now" style="left:${pct(NOW)}"></div><div class="dp-axis">${ticks}</div></div>`;
}

const host = document.getElementById('variants');
host.innerHTML = PALETTES.map((p, i) => `
  <section class="card mk-variant">
    <div class="mk-title">${p.name}</div>
    <p class="mk-desc">${p.desc}</p>
    <div class="mk-stage" data-i="${i}"></div>
    <div class="mk-swatches">${ITEMS.map(it => `<span class="mk-swatch" style="--c:${p.colors[it.id]}"><i></i>${it.label}</span>`).join('')}</div>
  </section>`).join('');
for (const el of document.querySelectorAll('.mk-stage')) render(el, PALETTES[el.dataset.i].colors);
</script>
</body>
</html>
